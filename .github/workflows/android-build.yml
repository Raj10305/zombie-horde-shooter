name: Build Android APK (Capacitor)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Package web assets into www/
        run: python build_www.py

      - name: Install dependencies
        run: npm install

      - name: Add & Sync Android platform (Capacitor)
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android Landscape Fullscreen Manifest
        run: |
          python -c '
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, "r", encoding="utf-8").read()
          if "screenOrientation" not in s:
              s = s.replace("<activity", "<activity android:screenOrientation=\"sensorLandscape\"", 1)
              open(p, "w", encoding="utf-8").write(s)
          '

      - name: Build Android Debug APK (Immediately Installable)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: DEADLINE-SKYFIRE-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
